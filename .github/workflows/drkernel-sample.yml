name: drkernel-sample

# Downloads the Dr. Kernel cold-start corpus on the runner, joins it with the
# contract verifier's released verdicts, and uploads a stratified sample.
# This job only reads data. It executes no corpus code.

on:
  push:
    branches: [audit-dev]
    paths:
      - "pilot/drkernel/fetch_sample.py"
      - ".github/workflows/drkernel-sample.yml"
  workflow_dispatch:
    inputs:
      n:
        description: "sample size"
        default: "300"

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install datasets
      - name: Fetch verifier verdicts
        run: |
          git clone --quiet https://github.com/RishiShah99/lethe ext/lethe
          git -C ext/lethe checkout --quiet 39db72c9964f
          git -C ext/lethe log -1 --format='%H %ad' --date=short
      - name: Build sample
        run: |
          python pilot/drkernel/fetch_sample.py --lethe ext/lethe --n "${{ inputs.n || '300' }}" --out data/drkernel_sample.jsonl
          python pilot/drkernel/fetch_sample.py --lethe ext/lethe --all-accepted --out data/drkernel_accepted.jsonl | tail -3
          gzip -9 data/drkernel_accepted.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: drkernel-data
          path: data/
          retention-days: 30
