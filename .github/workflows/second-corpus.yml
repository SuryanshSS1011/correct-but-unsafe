name: second-corpus

# Audits a sample of a second public corpus of generated Triton kernels. The
# audit jobs execute corpus code, so they hold no secrets and have a read-only
# token.

on:
  workflow_dispatch:
    inputs:
      corpus:
        description: "makora or traces"
        default: "makora"
      n:
        description: "uniform sample size"
        default: "1500"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install datasets
      - name: Lint and sample
        shell: bash
        run: python tools/sample_corpus.py --corpus "${{ inputs.corpus || 'makora' }}" --n "${{ inputs.n || '1500' }}" --out-dir data/corpus2 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: corpus2-sample
          path: data/corpus2/
          retention-days: 60

  audit:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU environment
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
          pip install -r requirements-cpu.txt
      - uses: actions/download-artifact@v4
        with:
          name: corpus2-sample
          path: data/corpus2
      - name: Audit shard ${{ matrix.shard }}
        run: |
          # A program that allocates without bound used to take the whole runner down, which also
          # lost the shard's results. The limit turns that into an error for one program.
          ulimit -v 11000000
          timeout --signal=INT 330m python pilot/drkernel/recheck.py --data data/corpus2/sample.jsonl --shard ${{ matrix.shard }}/8 \
            --modes eval --light --budget 300 --timeout 240 --out results/raw/corpus2_shard${{ matrix.shard }}.json || echo "shard stopped early with status $?"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus2-shard-${{ matrix.shard }}
          path: results/raw/
          retention-days: 60
